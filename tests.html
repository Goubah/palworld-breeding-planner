test('breeding table has no unset entries, except the one known gender-only pair', () => {
  // Katress + Wixen is the sole pair in the whole dataset with ONLY
  // gender-specific entries (Katress F + Wixen M -> Katress Ignis; Katress M
  // + Wixen F -> Wixen Noct) and no gender-agnostic fallback row. A
  // gender-agnostic (null, null) lookup is therefore expected to be the one
  // unresolved pair; every other pair must resolve.
  const katress = palByName('Katress'), wixen = palByName('Wixen');
  const n = ctx.pals.length;
  let checked = 0, nullCount = 0;
  const unresolved = [];
  for (let i = 0; i < n; i++) {
    for (let j = i; j < n; j++) {
      if (childOf(i, null, j, null) === null) { nullCount++; unresolved.push([i, j]); }
      checked++;
    }
  }
  assertEqual(checked, n * (n + 1) / 2, 'should check every canonical pair exactly once');
  assertEqual(nullCount, 1, `expected exactly 1 unresolved pair, got ${nullCount}: ${JSON.stringify(unresolved)}`);
  const [i, j] = unresolved[0];
  const isKatressWixen = (i === katress.i && j === wixen.i) || (i === wixen.i && j === katress.i);
  assert(isKatressWixen, `the one unresolved pair should be Katress/Wixen, got species #${i} + #${j}`);
});

test('inheritance rates reproduce published 40/24/12/10 for clean pools size 1-4', () => {
  const expected = { 1: 0.40, 2: 0.24, 3: 0.12, 4: 0.10 };
  for (const k of [1, 2, 3, 4]) {
    const mask = (1 << k) - 1;
    const outcomes = outcomeDistribution(mask, 0, mask, 0);
    const full = outcomes.find(o => o.mask === mask && o.junk === 0);
    assert(full, `no outcome found for full mask, k=${k}`);
    assertClose(full.p, expected[k], 1e-9, `k=${k}`);
  }
});

test('outcome distributions always sum to 1 across all valid signatures', () => {
  let checked = 0;
  for (let mask1 = 0; mask1 < 16; mask1++) {
    for (let junk1 = 0; junk1 <= 4 - popcount(mask1); junk1++) {
      for (let mask2 = 0; mask2 < 16; mask2++) {
        for (let junk2 = 0; junk2 <= 4 - popcount(mask2); junk2++) {
          const outcomes = outcomeDistribution(mask1, junk1, mask2, junk2);
          const total = outcomes.reduce((s, o) => s + o.p, 0);
          assertClose(total, 1, 1e-9, `mask1=${mask1},junk1=${junk1},mask2=${mask2},junk2=${junk2}`);
          checked++;
        }
      }
    }
  }
  assert(checked > 100, 'sanity: should have checked many signatures');
});

test('outcome invariant: popcount(mask)+junk <= 4 for every possible outcome', () => {
  let checked = 0;
  for (let mask1 = 0; mask1 < 16; mask1++) {
    for (let mask2 = 0; mask2 < 16; mask2++) {
      const outcomes = outcomeDistribution(mask1, 1, mask2, 1);
      for (const o of outcomes) {
        assert(popcount(o.mask) + o.junk <= 4, `invariant violated: mask=${o.mask} junk=${o.junk}`);
        checked++;
      }
    }
  }
  assert(checked > 0, 'sanity: should have checked outcomes');
});

test('inheritCountDistribution sums to 1 and clamps at pool size', () => {

});

test('feasibleGenderAssignments: regression for the bug where flexible (ANY) states lost the special-pair rule match', () => {
  // Caught during development: the generic non-special path queries
  // childOf(a.species, null, b.species, null), which is correct for every
  // normal pair but returns null for Katress/Wixen (whose only table rows
  // are gender-specific). Flexible 'ANY' states must still resolve to
  // concrete genders here rather than collapsing to null.
  const fixed = { species: 1, genderTag: 'F' };
  const flexible = { species: 2, genderTag: 'ANY' };

  const bothFlexible = feasibleGenderAssignments(flexible, { species: 3, genderTag: 'ANY' }, () => 0.5);
  assertEqual(bothFlexible.length, 2, 'both-flexible should offer both concrete gender orderings');
  const genders = bothFlexible.map(a => a.aGender + '/' + a.bGender).sort();
  assertEqual(JSON.stringify(genders), JSON.stringify(['FEMALE/MALE', 'MALE/FEMALE']));
  for (const a of bothFlexible) assertClose(a.p, 1, 1e-9);

  const oneFixed = feasibleGenderAssignments(fixed, flexible, (speciesIdx) => (speciesIdx === 2 ? 0.7 : 0.5));
  assertEqual(oneFixed.length, 1);
  assertEqual(oneFixed[0].aGender, 'FEMALE');
  assertEqual(oneFixed[0].bGender, 'MALE');
  assertClose(oneFixed[0].p, 0.7, 1e-9, 'flexible side must supply MALE at its species male-probability');

  const sameGenderFixed = feasibleGenderAssignments({ species: 1, genderTag: 'M' }, { species: 2, genderTag: 'M' }, () => 0.5);
  assertEqual(sameGenderFixed.length, 0, 'two fixed males can never be paired');
});

test('pairGenderInfo: gender is priced as a one-off setup cost, never per egg', () => {
  // The per-egg framing this replaced multiplied the CHILD's egg count by the
  // gender probability, which over-charges in proportion to how hard the step
  // is. Once a male and a female are paired, every egg they produce is usable,
  // so the cost is re-hatching a parent -- paid once, before any egg of the
  // child is laid.
  const fixedF = { species: 1, genderTag: 'F', effort: 0 };
  const flex = { species: 2, genderTag: 'ANY', effort: 100 };
  const maleProb = (i) => (i === 2 ? 0.7 : 0.5);

  const oneFixed = pairGenderInfo(fixedF, flex, maleProb);
  assertEqual(oneFixed.p, 1, 'gender must not touch the per-egg probability');
  assertEqual(oneFixed.reversalSide, null, 'reversal only applies when both sides are fixed');
  // Needs a male at p=0.7, so 1/0.7 copies in expectation. The first is
  // already paid for by flex.effort, leaving 100 * (1/0.7 - 1).
  assertClose(oneFixed.setup, 100 * (1 / 0.7 - 1), 1e-9);

  // Argument order must not change the price.
  const swapped = pairGenderInfo(flex, fixedF, maleProb);
  assertClose(swapped.setup, oneFixed.setup, 1e-9);

  // A flexible side that is already almost always the needed gender is nearly
  // free; one that almost never is costs many re-hatches.
  const easy = pairGenderInfo(fixedF, flex, () => 0.99).setup;
  const hard = pairGenderInfo(fixedF, flex, () => 0.01).setup;
  assert(easy < 2, `a 99% male species should be near-free to line up, got ${easy}`);
  assert(hard > 9000, `a 1% male species should be punishing, got ${hard}`);
});

test('pairGenderInfo: two flexible parents are not free, and the cheaper side gets re-rolled', () => {
  // The bug this covers: both-flexible returned p=1 with no cost at all, so a
  // pair of bred parents was priced as though gender did not exist, while an
  // owned parent was charged its species ratio. That quietly biased every
  // search away from the roster the tool exists to exploit.
  const a = { species: 1, genderTag: 'ANY', effort: 100 };
  const b = { species: 2, genderTag: 'ANY', effort: 400 };
  const even = pairGenderInfo(a, b, () => 0.5);
  assertEqual(even.p, 1, 'gender must not touch the per-egg probability');
  assertEqual(even.reversalSide, null, 'bred parents never need a Pal Reverser');
  assert(even.setup > 0, 'two flexible parents must cost something to line up');

  // Both 50/50: they clash half the time (a quarter both male, a quarter both
  // female), and the fix is one re-roll of the cheaper side, which lands on
  // the needed gender half the time. So 0.25*(2*100) + 0.25*(2*100) = 100.
  assertClose(even.setup, 100, 1e-9);

  // Re-rolling is the CHEAPER side's job, so making the expensive side even
  // more expensive must not change the price.
  const dearer = pairGenderInfo(a, { ...b, effort: 99999 }, () => 0.5);
  assertClose(dearer.setup, even.setup, 1e-9, 'the expensive side is never the one re-rolled');

  // Argument order must not change the price.
  assertClose(pairGenderInfo(b, a, () => 0.5).setup, even.setup, 1e-9);

  // Two parents of a heavily male-skewed species clash far more often, so
  // lining them up costs more than an even pair of the same efforts.
  const skewed = pairGenderInfo(a, { ...b, effort: 100 }, () => 0.9);
  const evenSame = pairGenderInfo(a, { ...b, effort: 100 }, () => 0.5);
  assert(skewed.setup > evenSame.setup,
    `a 90/10 species should be harder to pair than a 50/50 one (${skewed.setup} vs ${evenSame.setup})`);
});

test('dominance stays sound: a cheaper parent never costs more to line up', () => {
  // Before this model a parent's effort was purely additive -- it was added to
  // the child and had no other consequence. Now it also drives the gender
  // setup cost, so pruneDominated() (which discards a state the moment another
  // matches it at no greater effort) is only safe if that cost is monotone in
  // effort. If it were not, discarding the pricier state could throw away the
  // cheaper route, silently, with no way to notice from the output.
  const probs = [0.1, 0.3, 0.5, 0.7, 0.9];
  let checked = 0;
  for (const mDom of probs) {
    for (const mPartner of probs) {
      const maleProb = (i) => (i === 1 ? mDom : mPartner);
      for (const dominatingEffort of [0, 1, 50, 400]) {
        for (const dominatedEffort of [400, 900, 5000]) {
          if (dominatingEffort > dominatedEffort) continue;
          const better = { species: 1, genderTag: 'ANY', effort: dominatingEffort };
          const worse = { species: 1, genderTag: 'ANY', effort: dominatedEffort };
          for (const partner of [
            { species: 2, genderTag: 'ANY', effort: 250 },
            { species: 2, genderTag: 'M', effort: 0 },
            { species: 2, genderTag: 'F', effort: 0 },
          ]) {
            const cheap = pairGenderInfo(better, partner, maleProb);
            const dear = pairGenderInfo(worse, partner, maleProb);
            assert(cheap.setup <= dear.setup + 1e-9,
              `cheaper parent (${dominatingEffort}) cost ${cheap.setup} to line up vs ${dear.setup} for the pricier one (${dominatedEffort})`);
            checked++;
          }
        }
      }
    }
  }
  assert(checked > 200, `expected a broad sweep, only checked ${checked}`);
});

test('an unpairable gender ratio drops the pairing instead of costing infinity', () => {
  // No species in the shipped data sits at 0% or 100% male, so this guards a
  // future data regen rather than today's numbers. Two flexible parents of a
  // 100%-male species can never produce one of each, and an infinite setup
  // cost would otherwise become a state that eats a beam slot and can surface
  // as a route costing "unknown".
  const bothFlexible = pairGenderInfo(
    { species: 1, genderTag: 'ANY', effort: 100 },
    { species: 2, genderTag: 'ANY', effort: 100 },
    () => 1);
  assertEqual(Number.isFinite(bothFlexible.setup), false, 'the impossible case must be recognisable as impossible');

  const relaxaurus = palByName('Relaxaurus');
  const sparkit = palByName('Sparkit');
  const reptyro = palByName('Reptyro');
  assert(relaxaurus && sparkit && reptyro, 'fixture pals must exist');
  const ownedPals = [
    { speciesIdx: relaxaurus.i, gender: 'MALE', passiveInternalNames: [] },
    { speciesIdx: sparkit.i, gender: 'FEMALE', passiveInternalNames: [] },
  ];
  const run = (maleProbOf) => runSolver({
    ownedPals, targetSpeciesIdx: reptyro.i, desiredPassiveNames: [],
    maleProbOf, genderRules: ctx.meta.genderSpecificRules, maxSteps: 4,
  });

  const allMale = run(() => 1);
  for (const r of allMale.results) {
    assert(isFinite(r.effort), `a route came back costing ${r.effort}`);
  }

  // Guard the guard: if the fixture stopped finding routes at all, the loop
  // above would pass for the wrong reason.
  const normal = run((i) => ctx.pals[i].maleProb);
  assert(normal.results.length > 0, 'fixture must find routes at normal gender ratios');
  for (const r of normal.results) assert(isFinite(r.effort));
});

test('gender setup cost reaches the route, so the steps account for the total', () => {
  // The step view itemises eggs per step. If the solver charged a gender cost
  // the route never carried, the per-step numbers would silently stop adding
  // up to the total in the route header.
  const lamball = palByName('Lamball');
  const legend = ctx.passives.find(p => p.name === 'Legend');
  const lucky = ctx.passives.find(p => p.name === 'Lucky');
  assert(lamball && legend && lucky, 'fixture pal/passives must exist');

  const result = runSolver({
    ownedPals: [
      { speciesIdx: lamball.i, gender: 'MALE', passiveInternalNames: [legend.internalName] },
      { speciesIdx: lamball.i, gender: 'FEMALE', passiveInternalNames: [lucky.internalName] },
    ],
    targetSpeciesIdx: lamball.i,
    desiredPassiveNames: [legend.internalName, lucky.internalName],
    maleProbOf: (i) => ctx.pals[i].maleProb,
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 1,
  });

  assert(result.results.length > 0, 'expected a 1-step route');
  const best = result.results[0];
  assertEqual(best.genderSetup, 0,
    'two owned Pals of opposite gender need no lining up, so this step must carry no setup cost');
  assertClose(best.effort, best.attempts * 5, 1e-9,
    'with no setup and no Reverser, effort is exactly the egg time');
});

test('gender reversal: two owned same-gender Pals can still be bred, flagged in the route tree', () => {
  const lamball = palByName('Lamball');
  const legend = ctx.passives.find(p => p.name === 'Legend');
  const lucky = ctx.passives.find(p => p.name === 'Lucky');
  assert(lamball && legend && lucky, 'fixture pal/passives must exist');

  // Split the two desired (non-random) passives across two MALE Lamballs so
  // neither owned Pal alone already satisfies the target -- only breeding
  // them together (which requires a Pal Reverser, since both are male) can.
  const ownedPals = [
    { speciesIdx: lamball.i, gender: 'MALE', passiveInternalNames: [legend.internalName] },
    { speciesIdx: lamball.i, gender: 'MALE', passiveInternalNames: [lucky.internalName] },
  ];
  const result = runSolver({
    ownedPals,
    targetSpeciesIdx: lamball.i,
    desiredPassiveNames: [legend.internalName, lucky.internalName],
    maleProbOf: (i) => ctx.pals[i].maleProb,
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 1,
  });

  assert(result.results.length > 0, 'expected a route breeding two same-gender Lamballs via reversal to combine both passives');
  const best = result.results[0];
  assertEqual(best.type, 'bred');
  assertEqual(best.parentA.type, 'owned');
  assertEqual(best.parentB.type, 'owned');
  const reversedCount = (best.parentA.needsReversal ? 1 : 0) + (best.parentB.needsReversal ? 1 : 0);
  assertEqual(reversedCount, 1, 'exactly one parent should be flagged as needing a Pal Reverser');
});

test('gender reversal guard: a single owned Pal cannot be bred with itself', () => {
  // Caught during development: allowing same-gender pairs via Pal Reverser
  // also let the solver pair a state key with itself even when only ONE
  // physical Pal backs that key -- i.e. "breed this exact Pal with itself",
  // which isn't possible even with a Reverser (that flips a gender, it
  // doesn't duplicate the Pal). Pick a passive that can only ever appear via
  // random inheritance, so the only way this test could find a route is by
  // (incorrectly) breeding the lone owned Lamball with itself.
  const lamball = palByName('Lamball');
  const randomPassive = ctx.passives.find(p => p.randomAllowed && p.name !== 'Legend' && p.name !== 'Lucky');
  assert(lamball && randomPassive, 'fixture pal/passive must exist');

  const result = runSolver({
    ownedPals: [{ speciesIdx: lamball.i, gender: 'MALE', passiveInternalNames: [] }],
    targetSpeciesIdx: lamball.i,
    desiredPassiveNames: [randomPassive.internalName],
    maleProbOf: (i) => ctx.pals[i].maleProb,
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 3,
  });

  assertEqual(result.results.length, 0, 'a lone owned Pal has no partner to breed with, even with a Pal Reverser -- no route should be found');
});

test('dominance predicate: requires same species and gender, superset mask, no more junk or effort', () => {
  const base = { species: 5, genderTag: 'ANY', mask: 0b0101, junk: 1, effort: 100 };
  const better = { species: 5, genderTag: 'ANY', mask: 0b1101, junk: 0, effort: 80 };
  assertEqual(dominates(better, base), true, 'superset mask, less junk, less effort should dominate');
  assertEqual(dominates(base, better), false, 'domination is not symmetric here');
  assertEqual(dominates({ ...better, species: 6 }, base), false, 'different species must never dominate');
  assertEqual(dominates({ ...better, genderTag: 'M' }, base), false, 'different gender tag must never dominate');
  assertEqual(dominates({ ...better, junk: 2 }, base), false, 'more junk must not dominate');
  assertEqual(dominates({ ...better, effort: 200 }, base), false, 'more effort must not dominate');
  assertEqual(dominates({ ...better, mask: 0b0100 }, base), false, 'a non-superset mask must not dominate');
  assertEqual(dominates(base, base), true, 'a state trivially dominates itself');
});

test('dominance is sound: a dominating parent never lowers the odds of the desired result', () => {
  // pruneDominated() discards states on the assumption that a parent with a
  // superset of the desired passives and no more junk is at least as good for
  // every co-parent. That is an assumption about the inheritance model, not
  // just bookkeeping, so check it exhaustively rather than trusting it.
  const fullMask = 0b1111;
  const pFull = (mA, jA, mB, jB) => outcomeDistribution(mA, jA, mB, jB)
    .filter(o => (o.mask & fullMask) === fullMask)
    .reduce((acc, o) => acc + o.p, 0);

  const states = [];
  for (let mask = 0; mask < 16; mask++) {
    for (let junk = 0; junk + popcount(mask) <= 4; junk++) states.push([mask, junk]);
  }

  let checked = 0;
  for (const [mS, jS] of states) {
    for (const [mT, jT] of states) {
      // t dominates s on the passive axis
      if ((mT & mS) !== mS || jT > jS) continue;
      for (const [mB, jB] of states) {
        const withS = pFull(mS, jS, mB, jB);
        const withT = pFull(mT, jT, mB, jB);
        assert(withT >= withS - 1e-12,
          `dominating parent (${mT},${jT}) scored ${withT} vs (${mS},${jS}) at ${withS} against co-parent (${mB},${jB})`);
        checked++;
      }
    }
  }
  assert(checked > 5000, `expected a broad sweep, only checked ${checked} combinations`);
});

test('outcome invariant: a child mask is always a subset of the parents\' union', () => {
  // The final-round pruning in the solver skips any pair whose combined mask
  // doesn't already cover every desired passive, on the grounds that breeding
  // can never introduce a desired passive neither parent had. If random
  // additions could ever supply one, that pruning would silently drop valid
  // routes, so pin the invariant here rather than in a comment.
  const states = [];
  for (let mask = 0; mask < 16; mask++) {
    for (let junk = 0; junk + popcount(mask) <= 4; junk++) states.push([mask, junk]);
  }
  let checked = 0;
  for (const [m1, j1] of states) {
    for (const [m2, j2] of states) {
      const union = m1 | m2;
      for (const o of outcomeDistribution(m1, j1, m2, j2)) {
        assertEqual(o.mask & ~union, 0,
          `child mask ${o.mask} escaped parents' union ${union} for (${m1},${j1})+(${m2},${j2})`);
        checked++;
      }
    }
  }
  assert(checked > 5000, `expected a broad sweep, only checked ${checked} outcomes`);
});

test('a Pal Reverser route never wins a tie against one that needs no item', () => {
  // A same-gender pairing and a natural male/female pairing both score
  // probability 1, so their efforts tie exactly, and ties are settled by a
  // strict < comparison. With no cost on the item, whichever the search
  // reached first won permanently, so a Reverser route could displace an
  // identical one needing no item purely by discovery order.
  const lamball = palByName('Lamball');
  const legend = ctx.passives.find(p => p.name === 'Legend');
  const lucky = ctx.passives.find(p => p.name === 'Lucky');
  assert(lamball && legend && lucky, 'fixture pal/passives must exist');

  // Two males (a Reverser is required) plus a female alternative (none is).
  // Both pairings yield a Lamball carrying Legend and Lucky.
  const ownedPals = [
    { speciesIdx: lamball.i, gender: 'MALE',   passiveInternalNames: [legend.internalName] },
    { speciesIdx: lamball.i, gender: 'MALE',   passiveInternalNames: [lucky.internalName] },
    { speciesIdx: lamball.i, gender: 'FEMALE', passiveInternalNames: [lucky.internalName] },
  ];
  const usesReverser = (node) => node.type === 'owned'
    ? !!node.needsReversal
    : (!!node.needsReversal || usesReverser(node.parentA) || usesReverser(node.parentB));

  const run = (reverserPenalty) => runSolver({
    ownedPals,
    targetSpeciesIdx: lamball.i,
    desiredPassiveNames: [legend.internalName, lucky.internalName],
    maleProbOf: (i) => ctx.pals[i].maleProb,
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 2,
    reverserPenalty,
  });

  const priced = run(60);
  assert(priced.results.length > 0, 'expected a route with the penalty applied');
  assertEqual(usesReverser(priced.results[0]), false,
    'with the item priced, the pairing needing no Reverser must win');

  // Guard the guard: if the fixture stopped offering a Reverser route at all,
  // the assertion above would pass for the wrong reason.
  const free = run(0);
  assertEqual(usesReverser(free.results[0]), true,
    'fixture must still offer a Reverser route when the item is free, or this test proves nothing');
});


// --- route display model (js/ui/route-model.js) ---------------------------
// Pure structure, so these use hand-built trees rather than solver output --
// the point is the analysis, not the search.

const ownedLeaf = (species, mask, junk, genderTag, ownedRefs) =>
  ({ type: 'owned', species, mask, junk, genderTag, ownedRefs });
const bredNode = (species, mask, junk, parentA, parentB) =>
  ({ type: 'bred', species, mask, junk, genderTag: 'ANY', parentA, parentB });

test('countOwnedUses: one Pal used in several pairings counts as one Pal, not several', () => {
  // The real case this exists for: the Frostallion Noct route uses the single
  // owned Frostallion in three separate pairings. Frostallion can only be bred
  // from two Frostallions, so reading the tree as "you need three" would make
  // a runnable route look impossible.
  const fros = () => ownedLeaf(77, 0, 1, 'M', [234]);
  const other = ownedLeaf(50, 1, 0, 'F', [7]);
  const left = bredNode(78, 0, 1, fros(), other);
  const right = bredNode(78, 0, 1, fros(), fros());
  const root = bredNode(78, 1, 0, left, right);

  const uses = countOwnedUses(root);
  assertEqual(uses.get(leafStateKey(fros())), 3, 'the same owned state used three times must report 3');
  assertEqual(uses.get(leafStateKey(other)), 1);
  assertEqual(collectOwnedLeaves(root).length, 4, 'all owned leaves are collected, duplicates included');
});

test('leafStateKey: same species and gender but different passives are NOT the same Pal', () => {
  const a = ownedLeaf(77, 0b0001, 1, 'M', [1]);
  const b = ownedLeaf(77, 0b0010, 1, 'M', [2]);
  const c = ownedLeaf(77, 0b0001, 2, 'M', [3]);
  const d = ownedLeaf(77, 0b0001, 1, 'F', [4]);
  assert(leafStateKey(a) !== leafStateKey(b), 'different desired passives must not collapse');
  assert(leafStateKey(a) !== leafStateKey(c), 'different junk counts must not collapse');
  assert(leafStateKey(a) !== leafStateKey(d), 'different genders must not collapse');
  assertEqual(leafStateKey(a), leafStateKey(ownedLeaf(77, 0b0001, 1, 'M', [9])),
    'identical breeding-relevant state IS the same bucket, whichever roster entry backs it');
});

test('flattenSteps: post-order, so every parent is built before the step that uses it', () => {
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const inner = bredNode(10, 0, 0, leaf(1), leaf(2));
  const root = bredNode(20, 0, 0, inner, leaf(3));
  const steps = flattenSteps(root);

  assertEqual(steps.length, 2, 'two bred nodes means two steps');
  assertEqual(steps[0].node, inner, 'the nested pairing must come first');
  assertEqual(steps[1].node, root);
  assertEqual(steps[0].stepNumber, 1);
  assertEqual(steps[1].stepNumber, 2);
  assertEqual(steps[0].aStep, null, 'an owned parent has no producing step');
  assertEqual(steps[1].aStep, 1, 'a bred parent must point back at the step that made it');
  assertEqual(steps[1].bStep, null);
});

test('flattenSteps: owned-only tree has no steps at all', () => {
  assertEqual(flattenSteps(ownedLeaf(1, 0, 0, 'M', [0])).length, 0);
});

test('desiredFirst: desired passives sort ahead of junk, order otherwise preserved', () => {
  const out = desiredFirst(['junkA', 'wanted2', 'junkB', 'wanted1'], ['wanted1', 'wanted2']);
  assertEqual(out.join(','), 'wanted2,wanted1,junkA,junkB',
    'desired first (in their own original order), then the rest in theirs');
  assertEqual(desiredFirst([], ['x']).length, 0);
  assertEqual(desiredFirst(['a', 'b'], []).join(','), 'a,b', 'no desired list means no reordering');
});

test('layoutTree: every parent sits exactly one column left of its child', () => {
  // This is what keeps connectors one span long. Pinning owned Pals to a
  // single column instead would make leaf-to-deep-node links cross unrelated
  // nodes, which is what made a wide tree unreadable in the first place.
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const deep = bredNode(30, 0, 0, bredNode(20, 0, 0, leaf(1), leaf(2)), leaf(3));
  const root = bredNode(40, 0, 0, deep, leaf(4));
  const { nodes, columns, rows } = layoutTree(root);

  assertEqual(columns, 4, 'a 3-generation tree occupies 4 columns');
  assertEqual(rows, 4, 'one row per owned leaf');
  const byNode = new Map(nodes.map(r => [r.node, r]));
  for (const rec of nodes) {
    for (const kid of rec.kids) {
      assertEqual(byNode.get(kid.node).col, rec.col - 1,
        'a parent must be exactly one column left of its child');
    }
  }
  assertEqual(byNode.get(root).col, columns - 1, 'the target occupies the rightmost column');
});

test('layoutTree: leaves take distinct rows and each pairing sits between its parents', () => {
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const root = bredNode(40, 0, 0, bredNode(20, 0, 0, leaf(1), leaf(2)), leaf(3));
  const { nodes } = layoutTree(root);

  const leafRows = nodes.filter(r => r.node.type === 'owned').map(r => r.row).sort((a, b) => a - b);
  assertEqual(leafRows.join(','), '0,1,2', 'leaves take consecutive distinct rows');
  for (const rec of nodes) {
    if (!rec.kids.length) continue;
    const [a, b] = rec.kids;
    assertClose(rec.row, (a.row + b.row) / 2, 1e-9,
      'a bred node must sit midway between its two parents, or the connectors stop reading as a pedigree');
  }
});

// --- redundant Reverser routes -------------------------------------------
// Figures are real, measured on the user's 252-Pal roster. They are fixtures
// for the filter's decision, not assertions about what the solver costs, so a
// solver change cannot make these stale.

const routeOf = (depth, effort, usesReverser) => ({ depth, effort, usesReverser });

test('suppressRedundantReverserRoutes: hides a Reverser route the item-free one already beats', () => {
  // Frostallion Noct (Eternal Engine, Nimble, Swift, Runner). Same depth, and
  // the Reverser route costs 10 min more for an item on top.
  const free = routeOf(5, 1076.29, false);
  const rev = routeOf(5, 1086.29, true);
  const out = suppressRedundantReverserRoutes([free, rev]);
  assertEqual(out.length, 1, 'the dominated Reverser route must go');
  assertEqual(out[0], free, 'the surviving route is the item-free one');
});

test('suppressRedundantReverserRoutes: a threshold on the effort gap would not do this job', () => {
  // Why the rule is dominance and not "differs by less than the 2.5 min
  // Reverser penalty". Gender setup is a function of a branch's own effort, so
  // a penalty deep in the tree is re-charged at every level above it and never
  // reaches the root as 2.5. These are the seven junk Reverser routes measured
  // across the roster, with their real root-level gaps.
  const gaps = [
    ['Frostallion Noct', 5, 1076.29, 5, 1086.29],
    ['Robinquill Terra', 0, 0.00, 1, 40.96],
    ['Blazamut', 2, 69.44, 2, 78.61],
    ['Beakon', 2, 57.14, 2, 62.14],
    ['Ragnahawk', 3, 148.18, 3, 153.18],
    ['Suzaku', 2, 57.14, 2, 62.14],
    ['Warsect', 1, 20.83, 1, 23.33],
  ];
  const REVERSER_PENALTY = 2.5;
  let thresholdWouldCatch = 0;
  for (const [name, fd, fe, rd, re] of gaps) {
    const out = suppressRedundantReverserRoutes([routeOf(fd, fe, false), routeOf(rd, re, true)]);
    assertEqual(out.length, 1, `${name}: dominance must hide the Reverser route`);
    assertEqual(out[0].usesReverser, false, `${name}: the item-free route must survive`);
    if (re - fe < REVERSER_PENALTY) thresholdWouldCatch++;
  }
  assertEqual(thresholdWouldCatch, 0,
    'the "differs by less than the penalty" rule catches none of these, which is why it is not the rule');
});

test('suppressRedundantReverserRoutes: keeps a Reverser route that genuinely saves time', () => {
  // Lyleen Noct, same passives: the Reverser route is 592 min CHEAPER at the
  // same depth. Suppressing this would hide the better plan.
  const free = routeOf(4, 1464.84, false);
  const rev = routeOf(4, 872.71, true);
  const out = suppressRedundantReverserRoutes([free, rev]);
  assertEqual(out.length, 2, 'a Reverser route that beats the item-free one must stay');
  assert(out.includes(rev) && out.includes(free), 'both routes remain on offer');
});

test('suppressRedundantReverserRoutes: keeps a Reverser route when it is the only one', () => {
  // Katress Ignis returns no item-free route at all. With nothing to compare
  // against there is nothing to suppress, or the search would look like it
  // failed.
  const rev = routeOf(4, 538.43, true);
  assertEqual(suppressRedundantReverserRoutes([rev]).length, 1);
  assertEqual(suppressRedundantReverserRoutes([]).length, 0, 'no routes in, no routes out');
});

test('suppressRedundantReverserRoutes: fewer generations saves a costlier Reverser route', () => {
  // Dominance is on both axes. A Reverser route that costs more time but takes
  // a generation less is a real trade, so effort alone must not decide it.
  const free = routeOf(4, 100, false);
  const rev = routeOf(3, 130, true);
  assertEqual(suppressRedundantReverserRoutes([free, rev]).length, 2,
    'a shallower Reverser route survives even when it costs more time');
});

test('suppressRedundantReverserRoutes: an exact tie goes to the item-free route', () => {
  // Same depth, same effort. The item is then pure cost, so the Reverser route
  // has nothing to offer. Matches the solver, where ties already settle toward
  // needing no item.
  const free = routeOf(3, 250, false);
  const out = suppressRedundantReverserRoutes([free, routeOf(3, 250, true)]);
  assertEqual(out.length, 1, 'a tie is not a choice');
  assertEqual(out[0], free);
});

test('suppressRedundantReverserRoutes: never drops an item-free route', () => {
  // Even beaten on both axes, needing no item is an advantage the effort
  // number does not carry, so it always stays on screen.
  const free = routeOf(5, 900, false);
  const rev = routeOf(3, 100, true);
  const out = suppressRedundantReverserRoutes([free, rev]);
  assertEqual(out.length, 2, 'the item-free route survives being beaten outright');
  assert(out.includes(free));
});

test('suppressRedundantReverserRoutes: judges each Reverser route against every free one', () => {
  // The result list is not always two long. Results are one per surviving
  // target state, which differ by junk as well as by Reverser use -- a
  // four-passive search forces junk to 0 and really does cap at two, but
  // Robinquill Terra (three passives) returns five. A pairwise
  // first-free-vs-first-Reverser check would be wrong on those.
  const freeShallow = routeOf(2, 500, false);
  const freeCheap = routeOf(4, 80, false);
  const survivor = routeOf(3, 90, true);   // beaten by neither: shallower than
                                           // freeCheap, cheaper than freeShallow
  const doomed = routeOf(5, 600, true);    // freeCheap beats it on both axes
  const out = suppressRedundantReverserRoutes([freeShallow, freeCheap, survivor, doomed]);
  assertEqual(out.length, 3, 'only the route dominated by SOME free route is dropped');
  assert(out.includes(survivor), 'a Reverser route beaten by no single free route stays');
  assert(!out.includes(doomed), 'domination by a non-adjacent free route must still count');
});

test('suppressRedundantReverserRoutes: preserves input order', () => {
  // renderResults numbers the cards "Route 1", "Route 2" straight from this
  // list, so the solver's depth-then-effort ranking has to come through intact.
  const a = routeOf(2, 10, false), b = routeOf(2, 20, true), c = routeOf(3, 15, false);
  const out = suppressRedundantReverserRoutes([a, c, b]);
  assertEqual(out.length, 2);
  assertEqual(out[0], a, 'first in stays first out');
  assertEqual(out[1], c);
});

test('itemFreeRoutesFirst: the item-free route leads even when a Reverser route is faster', () => {
  // Lyleen Noct: the Reverser route really is 592 min cheaper, so the solver
  // ranks it first. Most players would rather not farm the item, and the plan
  // they are most likely to run should not be the one below a family tree.
  const rev = routeOf(4, 872.71, true);
  const free = routeOf(4, 1464.84, false);
  const out = itemFreeRoutesFirst([rev, free]);
  assertEqual(out.length, 2, 'ordering must not drop anything');
  assertEqual(out[0], free, 'the item-free route takes the top slot');
  assertEqual(out[1], rev, 'the faster Reverser route is still offered, just second');
});

test('itemFreeRoutesFirst: keeps the solver ranking inside each group', () => {
  // Generations-then-effort still decides the order among routes of the same
  // kind. Only the item-free/Reverser split is allowed to reorder anything.
  const f1 = routeOf(2, 10, false), f2 = routeOf(2, 30, false), f3 = routeOf(4, 5, false);
  const r1 = routeOf(1, 99, true), r2 = routeOf(3, 100, true);
  const out = itemFreeRoutesFirst([r1, f1, f2, r2, f3]);
  assertEqual(out.map(r => r.usesReverser).join(','), 'false,false,false,true,true',
    'every item-free route comes before every Reverser route');
  // Identity per slot, not a join: stringifying objects gives
  // "[object Object]" for every one of them, so a joined comparison of two
  // equal-length lists passes whatever order they are actually in.
  assertEqual(out[0], f1, 'item-free routes keep their incoming order');
  assertEqual(out[1], f2);
  assertEqual(out[2], f3);
  assertEqual(out[3], r1, 'Reverser routes keep theirs too');
  assertEqual(out[4], r2);
});

test('itemFreeRoutesFirst: no-op on lists that are all one kind', () => {
  const a = routeOf(1, 5, false), b = routeOf(2, 3, false);
  const out = itemFreeRoutesFirst([a, b]);
  assertEqual(out.length, 2, 'an all-item-free list keeps every route');
  assertEqual(out[0], a, 'and is left in exactly the order it arrived');
  assertEqual(out[1], b);
  const rev = [routeOf(4, 538.43, true)];
  assertEqual(itemFreeRoutesFirst(rev).length, 1,
    'a Reverser-only result still renders, it is the only plan there is');
  assertEqual(itemFreeRoutesFirst([]).length, 0);
});

test('suppress then order: the pipeline renderResults actually runs', () => {
  // The two functions compose in this direction in results.js, so pin the
  // combined behaviour rather than trusting each half separately.
  const pipeline = rs => itemFreeRoutesFirst(suppressRedundantReverserRoutes(rs));

  // Frostallion Noct: dominated Reverser route goes, one card left.
  const fnFree = routeOf(5, 1076.29, false);
  const fn = pipeline([fnFree, routeOf(5, 1086.29, true)]);
  assertEqual(fn.length, 1);
  assertEqual(fn[0], fnFree);

  // Lyleen Noct: both survive, item-free leads.
  const lyRev = routeOf(4, 872.71, true), lyFree = routeOf(4, 1464.84, false);
  const ly = pipeline([lyRev, lyFree]);
  assertEqual(ly.length, 2);
  assertEqual(ly[0], lyFree, 'route 1 is the plan needing no item');
  assertEqual(ly[1], lyRev);
});

runAll(reportEl).then(({ pass, fail }) => {
