test('breeding table has no unset entries, except the one known gender-only pair', () => {
  // Katress + Wixen is the sole pair in the whole dataset with ONLY
  // gender-specific entries (Katress F + Wixen M -> Katress Ignis; Katress M
  // + Wixen F -> Wixen Noct) and no gender-agnostic fallback row. A
  // gender-agnostic (null, null) lookup is therefore expected to be the one
  // unresolved pair; every other pair must resolve.
  const katress = palByName('Katress'), wixen = palByName('Wixen');
  const n = ctx.pals.length;
  let checked = 0, nullCount = 0;
  const unresolved = [];
  for (let i = 0; i < n; i++) {
    for (let j = i; j < n; j++) {
      if (childOf(i, null, j, null) === null) { nullCount++; unresolved.push([i, j]); }
      checked++;
    }
  }
  assertEqual(checked, n * (n + 1) / 2, 'should check every canonical pair exactly once');
  assertEqual(nullCount, 1, `expected exactly 1 unresolved pair, got ${nullCount}: ${JSON.stringify(unresolved)}`);
  const [i, j] = unresolved[0];
  const isKatressWixen = (i === katress.i && j === wixen.i) || (i === wixen.i && j === katress.i);
  assert(isKatressWixen, `the one unresolved pair should be Katress/Wixen, got species #${i} + #${j}`);
});

test('inheritance rates reproduce published 40/24/12/10 for clean pools size 1-4', () => {
  const expected = { 1: 0.40, 2: 0.24, 3: 0.12, 4: 0.10 };
  for (const k of [1, 2, 3, 4]) {
    const mask = (1 << k) - 1;
    const outcomes = outcomeDistribution(mask, 0, mask, 0);
    const full = outcomes.find(o => o.mask === mask && o.junk === 0);
    assert(full, `no outcome found for full mask, k=${k}`);
    assertClose(full.p, expected[k], 1e-9, `k=${k}`);
  }
});

test('outcome distributions always sum to 1 across all valid signatures', () => {
  let checked = 0;
  for (let mask1 = 0; mask1 < 16; mask1++) {
    for (let junk1 = 0; junk1 <= 4 - popcount(mask1); junk1++) {
      for (let mask2 = 0; mask2 < 16; mask2++) {
        for (let junk2 = 0; junk2 <= 4 - popcount(mask2); junk2++) {
          const outcomes = outcomeDistribution(mask1, junk1, mask2, junk2);
          const total = outcomes.reduce((s, o) => s + o.p, 0);
          assertClose(total, 1, 1e-9, `mask1=${mask1},junk1=${junk1},mask2=${mask2},junk2=${junk2}`);
          checked++;
        }
      }
    }
  }
  assert(checked > 100, 'sanity: should have checked many signatures');
});

test('outcome invariant: popcount(mask)+junk <= 4 for every possible outcome', () => {
  let checked = 0;
  for (let mask1 = 0; mask1 < 16; mask1++) {
    for (let mask2 = 0; mask2 < 16; mask2++) {
      const outcomes = outcomeDistribution(mask1, 1, mask2, 1);
      for (const o of outcomes) {
        assert(popcount(o.mask) + o.junk <= 4, `invariant violated: mask=${o.mask} junk=${o.junk}`);
        checked++;
      }
    }
  }
  assert(checked > 0, 'sanity: should have checked outcomes');
});

test('inheritCountDistribution sums to 1 and clamps at pool size', () => {
  for (let n = 0; n <= 6; n++) {
    const dist = inheritCountDistribution(n);
    let total = 0;
    for (const [g, p] of dist) {
      total += p;
      assert(g <= Math.max(n, 0), `g=${g} should be <= n=${n}`);
    }
    assertClose(total, 1, 1e-9, `n=${n}`);
  }
});

test('pre-flight: a target reachable only BEYOND maxSteps is blocked with the true generation count, not silently "reachable"', () => {
  // Reptyro is exactly 4 breeding generations from Relaxaurus+Sparkit (confirmed
  // earlier by direct construction of a real 4-generation route in the UI).
  const relaxaurus = palByName('Relaxaurus');
  const sparkit = palByName('Sparkit');
  const reptyro = palByName('Reptyro');
  assert(relaxaurus && sparkit && reptyro, 'fixture pals must exist');
  const ownedPals = [
    { speciesIdx: relaxaurus.i, gender: 'MALE', passiveInternalNames: [] },
    { speciesIdx: sparkit.i, gender: 'FEMALE', passiveInternalNames: [] },
  ];

  const tooFew = checkPreflight({
    ownedPals, targetSpeciesIdx: reptyro.i, desiredPassiveNames: [],
    passiveInfoByName: (n) => ctx.passives.find(p => p.internalName === n),
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 3,
  });
  assertEqual(tooFew.speciesReachable, true, 'Reptyro is reachable in principle');
  assertEqual(tooFew.minGenerations, 4, 'true minimum should be reported even when it exceeds maxSteps');
  assertEqual(tooFew.reachableWithinSteps, false);
  assertEqual(tooFew.blocked, true, 'must block rather than let a doomed search run');

  const enough = checkPreflight({
    ownedPals, targetSpeciesIdx: reptyro.i, desiredPassiveNames: [],
    passiveInfoByName: (n) => ctx.passives.find(p => p.internalName === n),
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 4,
  });
  assertEqual(enough.reachableWithinSteps, true);
  assertEqual(enough.blocked, false);

  const noMaxStepsGiven = checkPreflight({
    ownedPals, targetSpeciesIdx: reptyro.i, desiredPassiveNames: [],
    passiveInfoByName: (n) => ctx.passives.find(p => p.internalName === n),
    genderRules: ctx.meta.genderSpecificRules,
  });
  assertEqual(noMaxStepsGiven.reachableWithinSteps, true, 'omitting maxSteps should default to unbounded, matching prior behavior');
});

test('feasibleGenderAssignments: regression for the bug where flexible (ANY) states lost the special-pair rule match', () => {
  // Caught during development: the generic non-special path queries
  // childOf(a.species, null, b.species, null), which is correct for every
  // normal pair but returns null for Katress/Wixen (whose only table rows
  // are gender-specific). Flexible 'ANY' states must still resolve to
  // concrete genders here rather than collapsing to null.
  const fixed = { species: 1, genderTag: 'F' };
  const flexible = { species: 2, genderTag: 'ANY' };

  const bothFlexible = feasibleGenderAssignments(flexible, { species: 3, genderTag: 'ANY' }, () => 0.5);
  assertEqual(bothFlexible.length, 2, 'both-flexible should offer both concrete gender orderings');
  const genders = bothFlexible.map(a => a.aGender + '/' + a.bGender).sort();
  assertEqual(JSON.stringify(genders), JSON.stringify(['FEMALE/MALE', 'MALE/FEMALE']));
  for (const a of bothFlexible) assertClose(a.p, 1, 1e-9);

  const oneFixed = feasibleGenderAssignments(fixed, flexible, (speciesIdx) => (speciesIdx === 2 ? 0.7 : 0.5));
  assertEqual(oneFixed.length, 1);
  assertEqual(oneFixed[0].aGender, 'FEMALE');
  assertEqual(oneFixed[0].bGender, 'MALE');
  assertClose(oneFixed[0].p, 0.7, 1e-9, 'flexible side must supply MALE at its species male-probability');

  const sameGenderFixed = feasibleGenderAssignments({ species: 1, genderTag: 'M' }, { species: 2, genderTag: 'M' }, () => 0.5);
  assertEqual(sameGenderFixed.length, 0, 'two fixed males can never be paired');
});

test('pairGenderInfo: same-gender fixed pair is usable via Pal Reverser, flagged on one side', () => {
  const sameGender = pairGenderInfo({ species: 1, genderTag: 'M' }, { species: 2, genderTag: 'M' }, () => 0.5);
  assertEqual(sameGender.p, 1, 'a Pal Reverser makes the pairing fully usable, not just unlikely');
  assertEqual(sameGender.reversalSide, 'B', 'exactly one side should be flagged as needing the item');

  const diffGender = pairGenderInfo({ species: 1, genderTag: 'M' }, { species: 2, genderTag: 'F' }, () => 0.5);
  assertEqual(diffGender.p, 1);
  assertEqual(diffGender.reversalSide, null, 'no reversal needed when genders already differ');

  const oneFixed = pairGenderInfo({ species: 1, genderTag: 'F' }, { species: 2, genderTag: 'ANY' }, (i) => (i === 2 ? 0.7 : 0.5));
  assertClose(oneFixed.p, 0.7, 1e-9, 'flexible side must supply MALE at its species male-probability');
  assertEqual(oneFixed.reversalSide, null, 'reversal only applies when both sides are fixed');
});

test('gender reversal guard: a single owned Pal cannot be bred with itself', () => {

  // also let the solver pair a state key with itself even when only ONE

test('dominance predicate: requires same species and gender, superset mask, no more junk or effort', () => {
  const base = { species: 5, genderTag: 'ANY', mask: 0b0101, junk: 1, effort: 100 };
  const better = { species: 5, genderTag: 'ANY', mask: 0b1101, junk: 0, effort: 80 };
  assertEqual(dominates(better, base), true, 'superset mask, less junk, less effort should dominate');
  assertEqual(dominates(base, better), false, 'domination is not symmetric here');
  assertEqual(dominates({ ...better, species: 6 }, base), false, 'different species must never dominate');
  assertEqual(dominates({ ...better, genderTag: 'M' }, base), false, 'different gender tag must never dominate');
  assertEqual(dominates({ ...better, junk: 2 }, base), false, 'more junk must not dominate');
  assertEqual(dominates({ ...better, effort: 200 }, base), false, 'more effort must not dominate');
  assertEqual(dominates({ ...better, mask: 0b0100 }, base), false, 'a non-superset mask must not dominate');
  assertEqual(dominates(base, base), true, 'a state trivially dominates itself');
});

test('dominance is sound: a dominating parent never lowers the odds of the desired result', () => {
  // pruneDominated() discards states on the assumption that a parent with a
  // superset of the desired passives and no more junk is at least as good for
  // every co-parent. That is an assumption about the inheritance model, not
  // just bookkeeping, so check it exhaustively rather than trusting it.
  const fullMask = 0b1111;
  const pFull = (mA, jA, mB, jB) => outcomeDistribution(mA, jA, mB, jB)
    .filter(o => (o.mask & fullMask) === fullMask)
    .reduce((acc, o) => acc + o.p, 0);

  const states = [];
  for (let mask = 0; mask < 16; mask++) {
    for (let junk = 0; junk + popcount(mask) <= 4; junk++) states.push([mask, junk]);
  }

  let checked = 0;
  for (const [mS, jS] of states) {
    for (const [mT, jT] of states) {
      // t dominates s on the passive axis
      if ((mT & mS) !== mS || jT > jS) continue;
      for (const [mB, jB] of states) {
        const withS = pFull(mS, jS, mB, jB);
        const withT = pFull(mT, jT, mB, jB);
        assert(withT >= withS - 1e-12,
          `dominating parent (${mT},${jT}) scored ${withT} vs (${mS},${jS}) at ${withS} against co-parent (${mB},${jB})`);
        checked++;
      }
    }
  }
  assert(checked > 5000, `expected a broad sweep, only checked ${checked} combinations`);
});

test('outcome invariant: a child mask is always a subset of the parents\' union', () => {
  // The final-round pruning in the solver skips any pair whose combined mask
  // doesn't already cover every desired passive, on the grounds that breeding
  // can never introduce a desired passive neither parent had. If random
  // additions could ever supply one, that pruning would silently drop valid
  // routes, so pin the invariant here rather than in a comment.
  const states = [];
  for (let mask = 0; mask < 16; mask++) {
    for (let junk = 0; junk + popcount(mask) <= 4; junk++) states.push([mask, junk]);
  }
  let checked = 0;
  for (const [m1, j1] of states) {
    for (const [m2, j2] of states) {
      const union = m1 | m2;
      for (const o of outcomeDistribution(m1, j1, m2, j2)) {
        assertEqual(o.mask & ~union, 0,
          `child mask ${o.mask} escaped parents' union ${union} for (${m1},${j1})+(${m2},${j2})`);
        checked++;
      }
    }
  }
  assert(checked > 5000, `expected a broad sweep, only checked ${checked} outcomes`);
});

test('a Pal Reverser route never wins a tie against one that needs no item', () => {
  // A same-gender pairing and a natural male/female pairing both score
  // probability 1, so their efforts tie exactly, and ties are settled by a
  // strict < comparison. With no cost on the item, whichever the search
  // reached first won permanently, so a Reverser route could displace an
  // identical one needing no item purely by discovery order.
  const lamball = palByName('Lamball');
  const legend = ctx.passives.find(p => p.name === 'Legend');
  const lucky = ctx.passives.find(p => p.name === 'Lucky');
  assert(lamball && legend && lucky, 'fixture pal/passives must exist');

  // Two males (a Reverser is required) plus a female alternative (none is).
  // Both pairings yield a Lamball carrying Legend and Lucky.
  const ownedPals = [
    { speciesIdx: lamball.i, gender: 'MALE',   passiveInternalNames: [legend.internalName] },
    { speciesIdx: lamball.i, gender: 'MALE',   passiveInternalNames: [lucky.internalName] },
    { speciesIdx: lamball.i, gender: 'FEMALE', passiveInternalNames: [lucky.internalName] },
  ];
  const usesReverser = (node) => node.type === 'owned'
    ? !!node.needsReversal
    : (!!node.needsReversal || usesReverser(node.parentA) || usesReverser(node.parentB));

  const run = (reverserPenalty) => runSolver({
    ownedPals,
    targetSpeciesIdx: lamball.i,
    desiredPassiveNames: [legend.internalName, lucky.internalName],
    maleProbOf: (i) => ctx.pals[i].maleProb,
    genderRules: ctx.meta.genderSpecificRules,
    maxSteps: 2,
    reverserPenalty,
  });

  const priced = run(60);
  assert(priced.results.length > 0, 'expected a route with the penalty applied');
  assertEqual(usesReverser(priced.results[0]), false,
    'with the item priced, the pairing needing no Reverser must win');

  // Guard the guard: if the fixture stopped offering a Reverser route at all,
  // the assertion above would pass for the wrong reason.
  const free = run(0);
  assertEqual(usesReverser(free.results[0]), true,
    'fixture must still offer a Reverser route when the item is free, or this test proves nothing');
});


// --- route display model (js/ui/route-model.js) ---------------------------
// Pure structure, so these use hand-built trees rather than solver output --
// the point is the analysis, not the search.

const ownedLeaf = (species, mask, junk, genderTag, ownedRefs) =>
  ({ type: 'owned', species, mask, junk, genderTag, ownedRefs });
const bredNode = (species, mask, junk, parentA, parentB) =>
  ({ type: 'bred', species, mask, junk, genderTag: 'ANY', parentA, parentB });

test('countOwnedUses: one Pal used in several pairings counts as one Pal, not several', () => {
  // The real case this exists for: the Frostallion Noct route uses the single
  // owned Frostallion in three separate pairings. Frostallion can only be bred
  // from two Frostallions, so reading the tree as "you need three" would make
  // a runnable route look impossible.
  const fros = () => ownedLeaf(77, 0, 1, 'M', [234]);
  const other = ownedLeaf(50, 1, 0, 'F', [7]);
  const left = bredNode(78, 0, 1, fros(), other);
  const right = bredNode(78, 0, 1, fros(), fros());
  const root = bredNode(78, 1, 0, left, right);

  const uses = countOwnedUses(root);
  assertEqual(uses.get(leafStateKey(fros())), 3, 'the same owned state used three times must report 3');
  assertEqual(uses.get(leafStateKey(other)), 1);
  assertEqual(collectOwnedLeaves(root).length, 4, 'all owned leaves are collected, duplicates included');
});

test('leafStateKey: same species and gender but different passives are NOT the same Pal', () => {
  const a = ownedLeaf(77, 0b0001, 1, 'M', [1]);
  const b = ownedLeaf(77, 0b0010, 1, 'M', [2]);
  const c = ownedLeaf(77, 0b0001, 2, 'M', [3]);
  const d = ownedLeaf(77, 0b0001, 1, 'F', [4]);
  assert(leafStateKey(a) !== leafStateKey(b), 'different desired passives must not collapse');
  assert(leafStateKey(a) !== leafStateKey(c), 'different junk counts must not collapse');
  assert(leafStateKey(a) !== leafStateKey(d), 'different genders must not collapse');
  assertEqual(leafStateKey(a), leafStateKey(ownedLeaf(77, 0b0001, 1, 'M', [9])),
    'identical breeding-relevant state IS the same bucket, whichever roster entry backs it');
});

test('flattenSteps: post-order, so every parent is built before the step that uses it', () => {
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const inner = bredNode(10, 0, 0, leaf(1), leaf(2));
  const root = bredNode(20, 0, 0, inner, leaf(3));
  const steps = flattenSteps(root);

  assertEqual(steps.length, 2, 'two bred nodes means two steps');
  assertEqual(steps[0].node, inner, 'the nested pairing must come first');
  assertEqual(steps[1].node, root);
  assertEqual(steps[0].stepNumber, 1);
  assertEqual(steps[1].stepNumber, 2);
  assertEqual(steps[0].aStep, null, 'an owned parent has no producing step');
  assertEqual(steps[1].aStep, 1, 'a bred parent must point back at the step that made it');
  assertEqual(steps[1].bStep, null);
});

test('flattenSteps: owned-only tree has no steps at all', () => {
  assertEqual(flattenSteps(ownedLeaf(1, 0, 0, 'M', [0])).length, 0);
});

test('desiredFirst: desired passives sort ahead of junk, order otherwise preserved', () => {
  const out = desiredFirst(['junkA', 'wanted2', 'junkB', 'wanted1'], ['wanted1', 'wanted2']);
  assertEqual(out.join(','), 'wanted2,wanted1,junkA,junkB',
    'desired first (in their own original order), then the rest in theirs');
  assertEqual(desiredFirst([], ['x']).length, 0);
  assertEqual(desiredFirst(['a', 'b'], []).join(','), 'a,b', 'no desired list means no reordering');
});

test('layoutTree: every parent sits exactly one column left of its child', () => {
  // This is what keeps connectors one span long. Pinning owned Pals to a
  // single column instead would make leaf-to-deep-node links cross unrelated
  // nodes, which is what made a wide tree unreadable in the first place.
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const deep = bredNode(30, 0, 0, bredNode(20, 0, 0, leaf(1), leaf(2)), leaf(3));
  const root = bredNode(40, 0, 0, deep, leaf(4));
  const { nodes, columns, rows } = layoutTree(root);

  assertEqual(columns, 4, 'a 3-generation tree occupies 4 columns');
  assertEqual(rows, 4, 'one row per owned leaf');
  const byNode = new Map(nodes.map(r => [r.node, r]));
  for (const rec of nodes) {
    for (const kid of rec.kids) {
      assertEqual(byNode.get(kid.node).col, rec.col - 1,
        'a parent must be exactly one column left of its child');
    }
  }
  assertEqual(byNode.get(root).col, columns - 1, 'the target occupies the rightmost column');
});

test('layoutTree: leaves take distinct rows and each pairing sits between its parents', () => {
  const leaf = n => ownedLeaf(n, 0, 0, 'M', [n]);
  const root = bredNode(40, 0, 0, bredNode(20, 0, 0, leaf(1), leaf(2)), leaf(3));
  const { nodes } = layoutTree(root);

  const leafRows = nodes.filter(r => r.node.type === 'owned').map(r => r.row).sort((a, b) => a - b);
  assertEqual(leafRows.join(','), '0,1,2', 'leaves take consecutive distinct rows');
  for (const rec of nodes) {
    if (!rec.kids.length) continue;
    const [a, b] = rec.kids;
    assertClose(rec.row, (a.row + b.row) / 2, 1e-9,
      'a bred node must sit midway between its two parents, or the connectors stop reading as a pedigree');
  }
});

const reportEl = document.getElementById('report');
runAll(reportEl).then(({ pass, fail }) => {
  document.title = `${fail === 0 ? 'PASS' : 'FAIL'} (${pass}/${pass + fail}) - Tests`;
});
